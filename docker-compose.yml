services:
  web:
    build: .
    image: mquiroga2807/magna-web:latest
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=False
      - DOMAIN=localhost:8080
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
